<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Career Gateway | Savanna</title>
  <link rel="stylesheet" href="../assets/css/application_alx.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script src="/savanna/module/db-player.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container-xl" style="max-width: 68rem; padding: 2rem 1rem;">
    <nav aria-label="Breadcrumb" style="margin-bottom: 1.25rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
      <div>
        <a href="concept-with-navigation.html" style="font-weight: 700; color: #05192d;">&larr; Back to Lesson</a> |
        <a href="/demo/blank.html" style="font-weight: 700; color: #0d5c3a;">View Blank Host Proof</a>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" id="lang-en" style="min-height: 44px; padding: 0.4rem 0.8rem; font-weight: 700; border: 2px solid #05192d; background: #fff; border-radius: 6px;">English</button>
        <button type="button" id="lang-am" style="min-height: 44px; padding: 0.4rem 0.8rem; font-weight: 700; border: 2px solid #05192d; background: #fff; border-radius: 6px;">አማርኛ</button>
      </div>
    </nav>
    <h1 class="mb-2" style="color: #05192d;">Accessible Career Gateway</h1>
    <p class="text-body-secondary mb-4">
      Inclusive job listings powered by <code>&lt;db-job-card&gt;</code> with spoken audio summaries, 200% zoom reflow, private interview accommodation requests, Schema.org <code>JobPosting</code> JSON-LD, and Open Badges 3.0 credential verification.
    </p>
    <db-job-card id="career-card" api="/api/v1" job-id="accessible-va" lang="en"></db-job-card>
  </main>
  <script>
    document.getElementById("lang-en").addEventListener("click", () => {
      document.getElementById("career-card").setAttribute("lang", "en");
    });
    document.getElementById("lang-am").addEventListener("click", () => {
      document.getElementById("career-card").setAttribute("lang", "am");
    });
  </script>
</body>
</html>
