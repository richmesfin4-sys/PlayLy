<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorded Live Session Viewer | Savanna</title>
  <link rel="stylesheet" href="../assets/css/application_alx.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script src="/savanna/module/db-player.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container-xl" style="max-width: 74rem; padding: 2rem 1rem;">
    <nav aria-label="Breadcrumb" style="margin-bottom: 1.25rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
      <div>
        <a href="concept-with-navigation.html" style="font-weight: 700; color: #05192d;">&larr; Back to Concept Lesson</a> |
        <a href="jobs.html" style="font-weight: 700; color: #0d5c3a;">Open Career Gateway</a>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" id="live-en" style="min-height: 44px; padding: 0.4rem 0.8rem; font-weight: 700; border: 2px solid #05192d; background: #fff; border-radius: 6px;">English</button>
        <button type="button" id="live-am" style="min-height: 44px; padding: 0.4rem 0.8rem; font-weight: 700; border: 2px solid #05192d; background: #fff; border-radius: 6px;">አማርኛ</button>
      </div>
    </nav>
    <h1 class="mb-2" style="color: #05192d;">Recorded Live Session Viewer (Captions &amp; Synchronized Chat Log)</h1>
    <p class="text-body-secondary mb-3">
      Extra-credit module (<code>&lt;db-live-viewer&gt;</code>) pairing the accessible video player with a searchable, click-to-seek live training chat log and Grade 1 Braille (<code>.brf</code>) export.
    </p>
    <db-live-viewer
      id="live-viewer"
      title="ALX Training Session 3: WCAG 2.2 AA &amp; Screen Reader Testing"
      src="/savanna/assets/media/va-future-lesson.mp4"
      captions="/savanna/assets/captions/session-20261112-wcag.vtt,/savanna/assets/captions/va-future-am.vtt"
      lang="en">
    </db-live-viewer>
  </main>
  <script>
    document.getElementById("live-en").addEventListener("click", () => {
      document.getElementById("live-viewer").setAttribute("lang", "en");
    });
    document.getElementById("live-am").addEventListener("click", () => {
      document.getElementById("live-viewer").setAttribute("lang", "am");
    });
  </script>
</body>
</html>
